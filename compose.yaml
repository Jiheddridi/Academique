
services:

  mysql:
    image: mysql:8
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    image: jihed23/devopslab:backendImage
    container_name: backend

    ports:
      - "8085:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - app-network

    restart: unless-stopped


  frontend:
    image: jihed23/devopslab:frontend
    container_name: frontend

    ports:
      - "82:80"

    depends_on:
      - backend

    networks:
      - app-network

    restart: unless-stopped


volumes:
  mysql-data:


networks:
  app-network:

